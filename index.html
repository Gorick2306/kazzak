<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAZAKK SHOW — Официальный сайт артиста</title>
    <link rel="stylesheet" href="style.css?v=10">
    <style>
        html, body {
            width: 100vw;
            max-width: 100vw;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #site-frame {
            width: 100vw;
            max-width: 100vw;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

<iframe id="site-frame" src="home.html?v=10" style="width:100vw; max-width:100vw; height:100%; border:none;"></iframe>

<div class="global-player" id="global-player">
    <audio id="real-audio" preload="metadata"></audio>
    
    <button class="player-nav-btn" onclick="prevTrack()" title="Предыдущий трек">◀❚</button>
    <button class="play-circle" id="play-btn" onclick="toggleDemoPlay()">▶</button>
    <button class="player-nav-btn" onclick="nextTrack()" title="Следующий трек">❚▶</button>

    <div style="flex:1; min-width:0;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
            <span style="font-size:10px; color:var(--red); font-weight:800; text-transform:uppercase;">KAZAKK SHOW</span>
            <span id="time-display" style="font-size:10px; color:var(--muted); font-weight:700;">0:00 / 0:00</span>
        </div>
        <strong id="demo-title" style="font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Танцевальный поп-хит (Live)</strong>
        <input type="range" id="seek-bar" class="player-seek" value="0" min="0" max="100" step="1" oninput="seekAudio(this.value)">
    </div>

    <div class="eq-bars">
        <span></span><span></span><span></span><span></span><span></span>
    </div>
</div>

<script>
const playlist = [
    { title: 'Танцевальный поп-хит (Live)', file: 'audio/track-1.mp3', startSec: 0 },
    { title: 'Золотые хиты 90-х и 2000-х', file: 'audio/track-2.mp3', startSec: 60 },
    { title: 'Лирическая баллада (Лаунж)', file: 'audio/track-3.mp3', startSec: 30 }
];

let currentIndex = 0;
let isFirstLoad = true;

const audio = document.getElementById('real-audio');
const gPlayer = document.getElementById('global-player');
const btn = document.getElementById('play-btn');
const seekBar = document.getElementById('seek-bar');
const timeDisplay = document.getElementById('time-display');
const frame = document.getElementById('site-frame');

audio.src = playlist[0].file;

function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
}

function syncUI(playing) {
    const track = playlist[currentIndex];
    document.getElementById('demo-title').innerText = track.title;

    if (playing) {
        gPlayer.classList.add('playing');
        btn.innerText = '❚❚';
        btn.style.paddingLeft = '0px';
    } else {
        gPlayer.classList.remove('playing');
        btn.innerText = '▶';
        btn.style.paddingLeft = '3px';
    }

    if (frame.contentWindow) {
        frame.contentWindow.postMessage({
            type: 'sync',
            playing: playing,
            title: track.title,
            index: currentIndex
        }, '*');
    }
}

function loadAndPlay(index, useStartSec = true) {
    currentIndex = (index + playlist.length) % playlist.length;
    const track = playlist[currentIndex];
    audio.src = track.file;
    audio.onloadedmetadata = function() {
        seekBar.max = Math.floor(audio.duration);
        if (useStartSec && track.startSec > 0 && track.startSec < audio.duration) {
            audio.currentTime = track.startSec;
        }
        audio.play();
        syncUI(true);
    };
    isFirstLoad = false;
}

function toggleDemoPlay() {
    if (audio.paused) {
        if (isFirstLoad) loadAndPlay(0, true);
        else { audio.play(); syncUI(true); }
    } else {
        audio.pause();
        syncUI(false);
    }
}

function nextTrack() { loadAndPlay(currentIndex + 1, false); }
function prevTrack() { loadAndPlay(currentIndex - 1, false); }
function switchDemoByIndex(index) { loadAndPlay(index, true); }
function seekAudio(val) { audio.currentTime = val; }

audio.addEventListener('timeupdate', () => {
    if (!isNaN(audio.duration)) {
        seekBar.max = Math.floor(audio.duration);
        seekBar.value = Math.floor(audio.currentTime);
        timeDisplay.innerText = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
    }
});

audio.addEventListener('ended', () => nextTrack());
frame.addEventListener('load', () => syncUI(!audio.paused));

window.addEventListener('message', function(e) {
    if (!e.data || !e.data.type) return;
    if (e.data.type === 'toggle') toggleDemoPlay();
    if (e.data.type === 'switch') switchDemoByIndex(e.data.index);
});
</script>

</body>
</html>
